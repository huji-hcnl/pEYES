name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff
      - name: Lint
        run: ruff check peyes tests

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: pip install -e .
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Kaleido smoke test (write_image, guards against #15 regressing)
        run: |
          timeout 90 python -c "
          import kaleido
          import plotly.graph_objects as go
          kaleido.get_chrome_sync()
          go.Figure(data=[go.Scatter(y=[1, 3, 2])]).write_image('kaleido_smoke_test.png')
          print('kaleido write_image() OK')
          "
